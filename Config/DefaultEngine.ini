[/Script/Engine.RendererSettings]
; Nanite Geometry System
r.Nanite=1
r.Nanite.MaxNodesPerFrame=262144

; Lumen Global Illumination & Reflections
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.HardwareRayTracing=1
r.Lumen.Reflections.HardwareRayTracing=1
r.Lumen.ScreenTraces=1
r.Lumen.TranslucencyReflections.FrontLayer.Allow=1

; Hardware Ray Tracing & Skin Cache
r.RayTracing=True
r.SkinCache.CompileShaders=True
r.RayTracing.Geometry.InstancedStaticMeshes=1

; Virtual Shadow Maps (VSM)
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.Clipmap.FirstLevel=0

; Substrate Material Framework
r.Substrate=1
r.Substrate.BytesPerPixel=128

; Temporal Super Resolution (TSR) Anti-Aliasing (Method 4 = TSR)
r.AntiAliasingMethod=4
r.TSR.History.ScreenPercentage=100
r.TSR.ShadingRejection.Flickering=1

; Mesh Distance Fields
r.GenerateMeshDistanceFields=1
r.DistanceFields.AtlasSizeX=1024
r.DistanceFields.AtlasSizeY=1024

; MegaLights Framework (UE 5.8+)
r.MegaLights=1
r.MegaLights.Shadows=1
r.MegaLights.Volume=1

; Auto-Exposure (Eye Adaptation)
r.EyeAdaptationQuality=2
r.EyeAdaptation.LensAttenuation=0.78
r.DefaultFeature.AutoExposure=1
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.MotionBlur=0

[/Script/Engine.Engine]
