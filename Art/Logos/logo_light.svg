<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="peakGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Stylized Karst Alpine Peak Emblem -->
  <g transform="translate(60, 40)" filter="url(#subtleGlow)">
    <path d="M40 140 L80 40 L120 140 Z" fill="url(#peakGradLight)" opacity="0.85"/>
    <path d="M10 140 L50 70 L90 140 Z" fill="#0ea5e9" opacity="0.5"/>
    <path d="M90 140 L130 80 L170 140 Z" fill="#38bdf8" opacity="0.6"/>
    <!-- Glacial River Curve -->
    <path d="M30 145 Q80 135 150 148" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
  <!-- Typography (Light Version for Dark/Atmospheric Backgrounds) -->
  <text x="260" y="115" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
    AyWorld
  </text>
  <text x="265" y="160" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="700" fill="#38bdf8" letter-spacing="9">
    CLAUDE EDITION
  </text>
</svg>
